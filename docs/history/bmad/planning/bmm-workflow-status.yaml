# -----------------------------------------------------------------------------
# Filename: _bmad-output/planning-artifacts/bmm-workflow-status.yaml
# Description: Tracks progress through BMM methodology Analysis, Planning,
#              and Solutioning phases.
# -----------------------------------------------------------------------------

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - completed: Already finished or documented

# Phase 1: Analysis
# =================
analysis:
  # Initial discovery and product definition
  product-brief: completed
  research: optional

# Phase 2: Planning
# =================
planning:
  # Requirements and UX design
  prd: completed
  ux-design: completed

# Phase 3: Solutioning
# ===================
solutioning:
  # Technical design and architecture
  architecture: completed
  epics-and-stories: completed
  implementation-readiness: completed
