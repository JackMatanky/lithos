recommendations:
  immediate:
    - action: 'Inject SchemaEngine.SchemasSnapshot() (or similar) into initStorage so SchemaViewMigrator has data before adapters are exposed.'
      refs:
        - 'cmd/lithos/main.go:80-86'
    - action: 'Persist VaultFile.ModifiedAt()/Size when constructing domain.Note and remove the time.Now fallback from cache.ExtractFileModTime.'
      refs:
        - 'internal/app/vault/indexer.go:662-685'
        - 'internal/adapters/spi/cache/sqlite/writer.go:118-166'
        - 'internal/adapters/spi/cache/helper.go:66-81'
    - action: 'Create a SQLiteReaderAdapter in the container (and QueryService wiring) so MetadataQueryPort + schema views are used by CLI flows.'
      refs:
        - 'cmd/lithos/main.go:24-279'
  future:
    - action: 'Add an end-to-end startup test that boots the real container to ensure migrations and MetadataQueryPort wiring stay intact.'
      refs:
        - 'tests/integration/sqlite_cache_test.go'
