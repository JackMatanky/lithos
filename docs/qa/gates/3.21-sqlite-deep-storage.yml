nfr_validation:
  security:
    status: PASS
    notes: 'No new attack surface introduced.'
  performance:
    status: FAIL
    notes: 'Without schema view creation, all metadata queries devolve to json_extract table scans.'
  reliability:
    status: FAIL
    notes: 'modified_at and indexed_time are generated from the same timestamp so stale files can never be detected.'
