schema: 1
story: '3.21'
story_title: 'Implement SQLite Deep Storage with Schema-Driven Views'
gate: FAIL
status_reason: 'Schema views are never built and staleness metadata never reflects filesystem changes, so the deep-storage feature does not work at runtime.'
reviewer: 'Quinn (Test Architect)'
updated: '2025-11-21T17:00:37Z'
top_issues:
  - id: QA-321-1
    title: 'SchemaViewMigrator receives no schemas during CLI startup'
    severity: high
    suggested_owner: dev
    details: 'Storage() calls initStorage with nil schemas, so EnsureViews() exits early and FileClass/Frontmatter queries fall back to json_extract scans (cmd/lithos/main.go:80-86, internal/adapters/spi/cache/sqlite/view_migrator.go:51-57).'
  - id: QA-321-2
    title: 'modified_at/indexed_time stored from time.Now() so staleness checks never trip'
    severity: high
    suggested_owner: dev
    details: 'VaultIndexer never writes VaultFile metadata into the Note and ExtractFileModTime falls back to time.Now(), preventing AC 11-12 from ever succeeding (internal/app/vault/indexer.go:662-685, internal/adapters/spi/cache/sqlite/writer.go:118-166, internal/adapters/spi/cache/helper.go:66-81).'
