# -----------------------------------------------------------------------------
# Filename:    test-utils/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Test utilities crate for Lithos, providing async testing
#              patterns and infrastructure for all test suites.
# -----------------------------------------------------------------------------

[package]
name = "lithos-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Testing utilities and patterns for Lithos async operations"

[lib]
bench = false

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["test-util", "time", "sync", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-test = "0.4"
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
tempfile = "3.0"
rand = "0.8"
fake = { version = "2.10", features = ["derive"] }

rmp-serde = "1.3"
figment = { workspace = true, features = ["env", "toml"] }
criterion = { workspace = true }
dhat = { workspace = true }
lithos-test-macros = { path = "../macros" }
insta = { version = "1.39", features = ["json", "redactions", "filters"] }
mockall = "0.13"
 proptest = "1.4"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
