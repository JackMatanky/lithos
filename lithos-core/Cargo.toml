[package]
name = "lithos-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain and infrastructure for Lithos"

[dependencies]
# Persistence (zero-copy serialization)
redb.workspace = true
rkyv.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
blake3.workspace = true
rand.workspace = true
regex.workspace = true

# Error Handling (sync-first, no async)
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
miette.workspace = true

# Serialization (feature-gated per Proposal 10)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true

# Template & Parsing (domain logic, sync)
minijinja.workspace = true
pulldown-cmark.workspace = true
figment.workspace = true

[dev-dependencies]
# NO tokio - deferred to Phase 2 (LSP)
rstest = { workspace = true }
proptest = { workspace = true }
lithos-test-utils = { workspace = true }
tempfile.workspace = true
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = []
# Serde support for domain types (Proposal 10)
# Future: make serde optional with feature flags
# serde = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
