# -----------------------------------------------------------------------------
# Filename:    lithos/lithos-core/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Package manifest for the Lithos core crate, defining the domain
#              logic, infrastructure, and crate-specific dependencies.
# -----------------------------------------------------------------------------

[package]
name = "lithos-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Core domain and infrastructure for Lithos"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Persistence (zero-copy serialization)
redb.workspace = true
rkyv.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
blake3.workspace = true
regex.workspace = true
glob.workspace = true
walkdir.workspace = true
rayon.workspace = true

# Error Handling (sync-first, no async)
thiserror.workspace = true
# anyhow.workspace = true  # Completely unused - codebase uses thiserror exclusively
tracing.workspace = true
miette.workspace = true

# Serialization (feature-gated per Proposal 10)
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true

# Template & Parsing (domain logic, sync)
minijinja.workspace = true
pulldown-cmark.workspace = true

# Safe temporary file creation (used by atomic_write in production code)
tempfile.workspace = true
base64.workspace = true

[dev-dependencies]
# NO tokio - deferred to Phase 2 (LSP)
rstest = { workspace = true }
proptest = { workspace = true }
tempfile.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
glob.workspace = true
itoa = "1.0"
ryu = "1.0"

[[bench]]
name = "db_storage"
harness = false
path = "benches/db_storage.rs"

[[bench]]
name = "db_key_handling"
harness = false
path = "benches/db_key_handling.rs"

[[bench]]
name = "string_construction"
harness = false
path = "benches/string_construction.rs"

[[bench]]
name = "note_parsing"
harness = false
path = "benches/note_parsing.rs"

# [[bench]]
# name = "schema_loader"
# harness = false
# path = "benches/schema_loader.rs"
# DISABLED: Pending migration to Repository pattern - see INTEGRATION_TESTS_TODO.md

[features]
default = []
# Serde support for domain types (Proposal 10)
# Future: make serde optional with feature flags
# serde = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
