# -----------------------------------------------------------------------------
# Filename:    lithos/.pre-commit-config.yaml
# Docs:        https://pre-commit.com/
# Description: Pre-commit hooks for code quality, notebook sync, and hygiene
# -----------------------------------------------------------------------------

exclude: (^|/)vendor/

repos:
  # -------------------- Pre-Commit Hooks -------------------- #
  # Docs: https://github.com/pre-commit/pre-commit-hooks/tree/main/pre_commit_hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: "Hygiene: Prevent Large Files"
        args: ["--maxkb=500"]
      - id: check-case-conflict
        name: "Hygiene: Check Case Conflicts"
      - id: check-executables-have-shebangs
        name: "Hygiene: Ensure Shebangs"
      - id: check-merge-conflict
        name: "Hygiene: Detect Merge Conflicts"
      - id: check-symlinks
        name: "Hygiene: Check Broken Symlinks"
      - id: end-of-file-fixer
        name: "Hygiene: Ensure Final Newline"
      - id: trailing-whitespace
        name: "Hygiene: Remove Trailing Whitespace"
      - id: mixed-line-ending
        name: "Hygiene: Fix Mixed Line Endings"
        args: [--fix=lf]
      - id: check-json
        name: "Validate: JSON"
        exclude: ^testdata/(schema|schemas)/(invalid|invalid/)
      - id: check-toml
        name: "Validate: TOML"
      - id: check-yaml
        name: "Validate: YAML"

  # ---------------------- Gitleaks Scan --------------------- #
  # Docs: https://github.com/gitleaks/gitleaks?tab=readme-ov-file#pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "Security: Gitleaks Secret Scan"
        args: ["--no-banner"]

  # ---------------------- Shell Quality --------------------- #
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "Quality: ShellCheck"

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        name: "Quality: shfmt (Google Style)"
        args: ["-i", "2", "-ci"]

  # ----------------- Conventional Commits ------------------- #
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        name: "Commit: Conventional Commits Check"
        stages: [commit-msg]
        args: ["--strict", "--verbose"]

  # ----------------------- Rust Quality --------------------- #
  - repo: local
    hooks:
      - id: rust-fmt
        name: "Quality: Rust Format (cargo +nightly fmt)"
        entry: cargo +nightly fmt --all -- --check --unstable-features
        language: system
        types: [rust]
        pass_filenames: false
      - id: rust-clippy
        name: "Quality: Rust Clippy (cargo clippy)"
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: "Quality: Rust Tests (cargo test)"
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.19.0
    hooks:
      - id: cargo-deny
        name: "Security: Cargo Deny Check"
        args: ["check"]
