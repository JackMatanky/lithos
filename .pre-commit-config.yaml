# -----------------------------------------------------------------------------
# Filename: lithos/.pre-commit-config.yaml
# Docs: https://pre-commit.com/
# Description: Pre-commit hooks for code quality, notebook sync, and hygiene
# -----------------------------------------------------------------------------

exclude: (^|/)vendor/

repos:
  # -------------------- Pre-Commit Hooks -------------------- #
  # Docs: https://github.com/pre-commit/pre-commit-hooks/tree/main/pre_commit_hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Prevent Large Files in Git
        args: ["--maxkb=500"]
      - id: check-case-conflict
        name: Check for Case Conflicts
      - id: check-executables-have-shebangs
        name: Ensure Executable Scripts Have Shebangs
      - id: check-merge-conflict
        name: Detect Merge Conflict Markers
      - id: check-symlinks
        name: Check for Broken Symlinks
      - id: end-of-file-fixer
        name: Ensure Final Newline
      - id: trailing-whitespace
        name: Remove Trailing Whitespace
      - id: mixed-line-ending
        name: Fix Mixed Line Endings
        args: [--fix=lf]
      - id: check-json
        name: Validate JSON Files
        exclude: ^testdata/(schema|schemas)/(invalid|invalid/)
      - id: check-toml
        name: Validate TOML Files
      - id: check-yaml
        name: Validate YAML Files

  # ---------------------- Gitleaks Scan --------------------- #
  # Docs: https://github.com/gitleaks/gitleaks?tab=readme-ov-file#pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        args: ["--no-banner"]

  # ---------------------- Shell Quality --------------------- #
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        name: shfmt
        args: ["-i", "2", "-ci"]

  # ----------------------- Rust Quality --------------------- #
  - repo: local
    hooks:
      - id: rust-fmt
        name: rust fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: rust-clippy
        name: rust clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: rust-test
        name: rust test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
