# -----------------------------------------------------------------------------
# Filename:    lithos/deny.toml
# Docs:        https://embarkstudios.github.io/cargo-deny/
# Description: Configuration for cargo-deny to audit dependencies, licenses,
#              advisories, and sources.
# -----------------------------------------------------------------------------

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Note: yanked and vulnerability checks are enabled by default in cargo-deny 0.19+

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip-tree = []

[[bans.skip]]
name = "unicode-width"
version = "0.1.14"

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
