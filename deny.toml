# -----------------------------------------------------------------------------
# Filename:    lithos/deny.toml
# Docs:        https://embarkstudios.github.io/cargo-deny/
# Description: Configuration for cargo-deny to audit dependencies, licenses,
#              advisories, and sources.
# -----------------------------------------------------------------------------

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Note: yanked and vulnerability checks are enabled by default in cargo-deny 0.19+

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip-tree = []

[[bans.skip]]
name = "unicode-width"
version = "0.1.14"

[[bans.skip]]
name = "unicode-width"
version = "0.2.2"

[[bans.skip]]
name = "rand"
version = "0.8.5"

[[bans.skip]]
name = "rand_chacha"
version = "0.3.1"

[[bans.skip]]
name = "rand_core"
version = "0.6.4"

[[bans.skip]]
name = "windows-targets"
version = "0.52.6"


[[bans.skip]]
name = "windows_aarch64_gnullvm"
version = "0.52.6"

[[bans.skip]]
name = "windows_aarch64_msvc"
version = "0.52.6"

[[bans.skip]]
name = "windows_i686_gnu"
version = "0.52.6"

[[bans.skip]]
name = "windows_i686_gnullvm"
version = "0.52.6"

[[bans.skip]]
name = "windows_i686_msvc"
version = "0.52.6"

[[bans.skip]]
name = "windows_x86_64_gnu"
version = "0.52.6"

[[bans.skip]]
name = "windows_x86_64_gnullvm"
version = "0.52.6"

[[bans.skip]]
name = "windows_x86_64_msvc"
version = "0.52.6"

[[bans.skip]]
name = "windows-sys"

version = "0.59.0"

[[bans.skip]]
name = "windows-sys"
version = "0.60.2"

[[bans.skip]]
name = "windows-sys"
version = "0.61.2"

[[bans.skip]]
name = "hashbrown"
version = "0.15.5"

[[bans.skip]]
name = "getrandom"
version = "0.2.17"

[[bans.skip]]
name = "toml_datetime"
version = "0.6.11"

[[bans.skip]]
name = "toml_edit"
version = "0.22.27"

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
