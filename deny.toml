# -----------------------------------------------------------------------------
# Filename:    lithos/deny.toml
# Docs:        https://embarkstudios.github.io/cargo-deny/
# Description: Configuration for cargo-deny to audit dependencies, licenses,
#              advisories, and sources.
# -----------------------------------------------------------------------------

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Note: yanked and vulnerability checks are enabled by default in cargo-deny 0.19+

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    # MPL-2.0: option-ext (transitive dep of dirs via dirs-sys)
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip-tree = []

[[bans.skip]]
name = "unicode-width"
version = "0.1.14"

[[bans.skip]]
name = "wit-bindgen"
version = "0.46.0"

# getrandom: multiple versions pulled in transitively via dirs (0.2.x via
# redox_users/dirs-sys) and uuid/tempfile/rkyv (0.4.x).
[[bans.skip]]
name = "getrandom"
version = "0.2.17"

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
