name: CI

on:
  push:
    branches: [ main, rust-conversion ]
  pull_request:
    branches: [ main, rust-conversion ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '*.md'
            ci:
              - '.github/workflows/**'
              - 'mise.toml'
              - '.mise/tasks/**'

  quality-gates:
    name: Quality Gates
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-11
          components: rustfmt, clippy
      - uses: jdx/mise-action@v4
      - uses: swatinem/rust-cache@v2
      - name: Run Quality Gates
        run: mise run quality

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust-version }})
    needs: [changes, quality-gates]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-version: stable

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-11
          components: rustfmt, clippy
      - uses: jdx/mise-action@v4
        env:
          MISE_RUST_VERSION: ${{ matrix.rust-version }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust-version }}
      - name: Run Tests (Changed Only)
        if: github.event_name == 'pull_request'
        run: mise run test:changed
      - name: Run Full Tests
        if: github.event_name != 'pull_request'
        run: mise run test
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.rust-version }}
          path: target/nextest-*.xml
          retention-days: 7

  burn-in:
    name: Burn-In (Flaky Detection)
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-11
          components: rustfmt, clippy
      - uses: jdx/mise-action@v4
      - uses: swatinem/rust-cache@v2
      - name: Run Burn-In Loop
        run: mise run test:burn-in 10 "test"

  coverage:
    name: Coverage Report
    needs: [changes, quality-gates]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-11
          components: rustfmt, clippy
      - uses: jdx/mise-action@v4
      - uses: swatinem/rust-cache@v2
      - name: Generate Coverage
        timeout-minutes: 20
        continue-on-error: true
        run: mise run test:coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/tarpaulin/
          retention-days: 30

  security:
    name: Security Scan
    needs: [changes, quality-gates]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  performance:
    name: Performance Benchmarks
    needs: [changes, quality-gates]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: swatinem/rust-cache@v2
      - name: Run Benchmarks
        uses: boa-dev/criterion-compare-action@v3
        with:
          branchName: ${{ github.base_ref }}

  # cross-compile-check:
  #   name: Cross-Compile Check (${{ matrix.target }})
  #   needs: [changes, quality-gates]
  #   if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       target: [wasm32-unknown-unknown, x86_64-unknown-linux-gnu]
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: dtolnay/rust-toolchain@master
  #       with:
  #         toolchain: stable
  #         targets: ${{ matrix.target }}
  #     - uses: jdx/mise-action@v4
  #     - uses: swatinem/rust-cache@v2
  #     - name: Check Compilation
  #       run: cargo check --target ${{ matrix.target }}

  deployment-readiness:
    name: Deployment Readiness
    needs: [quality-gates, secrets-detection, test, coverage, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Readiness Confirmed
        run: echo "🚀 Deployment readiness confirmed."
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const msg = `❌ CI Build Failed!
            Repo: ${owner}/${repo}
            Run: https://github.com/${owner}/${repo}/actions/runs/${run_id}

            Note: Slack/Discord webhook integration required for external notifications.`;
            console.log(msg);
