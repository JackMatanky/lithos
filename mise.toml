# -----------------------------------------------------------------------------
# Filename:    lithos/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
# Core Runtime
rust = { version = "nightly-2026-01-11", profile = "default" }
pre-commit = "latest"

# Development Utilities
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:critcmp" = "latest"
"cargo:wasm-pack" = "latest"

# ------------------------------------------------------------- #
#                           SETTINGS                            #
# ------------------------------------------------------------- #
[settings]
experimental = true
# Automate tool installation and management
env_shell_expand = true
lockfile = true
auto_install = true
not_found_auto_install = true
fetch_remote_versions_cache = "1h"
fetch_remote_versions_timeout = "10s"
use_versions_host = true
trusted_config_paths = ["{{config_root}}"]

# ------------------------------------------------------------- #
#                       ENVIRONMENT                             #
# ------------------------------------------------------------- #
[env]
CODEX_HOME = ".codex"

# Test configuration for ADR 0010 test utilities integration
TEST_THREADS = "4"
CARGO_TEST_ARGS = "--lib --bins"
TEST_OUTPUT_DIR = "{{config_root}}/test-output"
CI = "${GITHUB_ACTIONS:-false}"

# Project paths (available for tasks)
PROJECT_ROOT = "{{config_root}}"
CORE_CRATE = "{{vars.core_crate}}"
CLI_CRATE = "{{vars.cli_crate}}"

# ------------------------------------------------------------- #
#                        VARIABLES                              #
# ------------------------------------------------------------- #
[vars]
# Specific crate paths
core_crate = "lithos-core"
cli_crate = "lithos-cli"

# Test and benchmark paths
test_bench_dir = "benches"

# Directory paths
docs_dir = "docs"
adr_dir = "docs/adr"

# Build and test outputs
target_dir = "target"
target_doc_dir = "target/doc"
nextest_dir = "target/nextest"

# Report files
coverage_report = "tarpaulin-report.html"
junit_unit = "nextest-unit.xml"
junit_integration = "nextest-integration.xml"

# Build artifacts
binary_name = "lithos"

# Benchmark configuration
bench_archive_dir = ".benchmarks"
bench_package_core = "lithos-core"
bench_package_cli = "lithos-cli"

# ------------------------------------------------------------- #
#                             Tasks                             #
# ------------------------------------------------------------- #

# -------------------------- Testing -------------------------- #
[tasks.test]
description = "Run all tests (unit, integration, and e2e)"
alias = "t"
depends = ["test:unit", "test:integration", "test:e2e"]

# Specific crate unit tests for developer convenience
[tasks."test:unit:core"]
description = "Run core crate unit tests"
alias = "tucore"
run = "mise run test:unit -p core"
quiet = false

[tasks."test:unit:cli"]
description = "Run CLI crate unit tests"
alias = "tucli"
run = "mise run test:unit -p cli"
quiet = false

# Specific module unit tests within lithos-core for granular testing
[tasks."test:unit:config"]
description = "Run config module unit tests"
alias = "tuconf"
run = "mise run test:unit -p config"
quiet = false

[tasks."test:unit:note"]
description = "Run note module unit tests"
alias = "tunote"
run = "mise run test:unit -p note"
quiet = false

[tasks."test:unit:schema"]
description = "Run schema module unit tests"
alias = "tusch"
run = "mise run test:unit -p schema"
quiet = false

[tasks."test:unit:template"]
description = "Run template module unit tests"
alias = "tutemp"
run = "mise run test:unit -p template"
quiet = false

[tasks."test:unit:db"]
description = "Run db module unit tests"
alias = "tudb"
run = "mise run test:unit -p db"
quiet = false

[tasks."test:unit:fs"]
description = "Run fs module unit tests"
alias = "tufs"
run = "mise run test:unit -p fs"
quiet = false

# Specific crate benchmarks for developer convenience
[tasks."test:bench:core"]
description = "Run core crate benchmarks"
alias = "tbcore"
run = "mise run test:bench -p core"
quiet = false

[tasks."test:bench:cli"]
description = "Run CLI crate benchmarks"
alias = "tbcli"
run = "mise run test:bench -p cli"
quiet = false

# --------------------- CI/CD Simulation ---------------------- #
[tasks.ci]
description = "Simulate CI/CD pipeline"
depends = ["verify", "test:integration"]

[tasks.timing]
description = "Run verify with detailed timing information"
run = "mise run --timing verify"
shell = "bash"

# Hidden internal tasks (not shown in mise tasks)
[tasks._setup]
description = "Internal setup task"
run = "echo 'Setup complete'"
hide = true

[tasks._cleanup]
description = "Internal cleanup task"
run = "echo 'Cleanup complete'"
hide = true

# ------------------------- Cleanup --------------------------- #
# Note: Main clean task is defined in .mise/tasks/clean (file-based task)
# These are convenient aliases that call the main task with specific targets

[tasks."clean:cargo"]
description = "Clean only cargo build artifacts"
run = "mise run clean cargo"

[tasks."clean:test"]
description = "Clean only test output artifacts"
run = "mise run clean test"

[tasks."clean:reports"]
description = "Clean only coverage and JUnit reports"
run = "mise run clean reports"

# ----------------------- Quality Gates ----------------------- #
[tasks.quality]
description = "Run all quality gates (fmt, lint, adr:validate)"
alias = "q"
depends = ["lint", "adr:validate"]

[tasks.verify]
description = "Full quality gate orchestration"
alias = "v"
depends = ["lint", "test", "deny"]

[tasks.deny]
description = "Check dependencies for security vulnerabilities and license compliance"
run = "cargo deny check"
