# -----------------------------------------------------------------------------
# Filename:     lithos/mise.toml
# Docs:         https://mise.jdx.dev/
# Description:  Optimized task configuration using vars and task patterns
# -----------------------------------------------------------------------------

# ------------------------------------------------------------ #
#                             Tools                            #
# ------------------------------------------------------------ #
[tools]
go = "latest"
golangci-lint = "latest"
pre-commit = "latest"

# ------------------------------------------------------------ #
#                          Environment                         #
# ------------------------------------------------------------ #
[env]
GOBIN = "{{config_root}}/bin"
PATH = "{{config_root}}/bin:{{env.PATH}}"
CODEX_HOME = "{{config_root}}/.codex"

# ------------------------------------------------------------ #
#                          Variables                           #
# ------------------------------------------------------------ #
# Shared variables for tasks (not exported as env vars)
[vars]
# Common paths
cmd_path = "./cmd/lithos"
bin_dir = "bin"

# Common Go flags
ldflags = "-ldflags=\"-s -w\""
go_test_flags = "-v"
go_bench_flags = "-bench=. -benchmem"

# Artifact directories
artifacts_dir = "{{config_root}}/tests/artifacts"
profile_dir = "{{config_root}}/tests/artifacts/profiles"
report_dir = "{{config_root}}/tests/artifacts/reports"
baseline_dir = "{{config_root}}/tests/artifacts/baseline"

# Performance test paths
perf_pkg = "./tests/performance"
perf_test_name = "TestLargeVaultPerformance"

# Coverage paths
coverage_dir = "{{vars.artifacts_dir}}/coverage"
coverage_out = "{{vars.coverage_dir}}/coverage.out"
coverage_html = "{{vars.coverage_dir}}/coverage.html"

# Profile generation command template
prof_cmd_base = "go test -bench=BenchmarkLargeVault {{vars.perf_pkg}}"

# ------------------------------------------------------------ #
#                           Settings                           #
# ------------------------------------------------------------ #
[settings]
# Install what's missing when entering the repo or running tasks
auto_install = true
# Make "command not found → install" work (nice for new devs)
not_found_auto_install = true
# Keep remote version checks reasonably fast
fetch_remote_versions_cache = "1h"
# Timeout for version checks
fetch_remote_versions_timeout = "10s"
# Use version host for faster checks
use_versions_host = true
# Trust this repo so people aren't prompted every time (optional)
trusted_config_paths = ["{{config_root}}"]
# We want to actually write a lockfile so CI gets the same versions
lockfile = true
# Make sure GOROOT is set from the tool you installed
go_set_goroot = true
# Set GOBIN automatically (we also set it in [env], this just reinforces)
go_set_gobin = true
# Use Google mirror for faster downloads in some regions
go_download_mirror = "https://dl.google.com/go"

# ------------------------------------------------------------- #
#                             Tasks                             #
# ------------------------------------------------------------- #

# --------------------------- Setup --------------------------- #
[tasks.setup]
description = "Setup dev environment (basic). Downloads dependencies"
run = '''
echo "🚀 Setting up development environment..."
go mod download
echo "ℹ️  Installing tools from go.mod..."
go mod download -x
echo "✅ Development environment ready"
echo "ℹ️  Tools available via: go run <tool-import-path>"
'''


[tasks."setup:pre-commit"]
description = "Install pre-commit hooks"
run = "pre-commit install"


# --------------------------- Build --------------------------- #
[tasks.build]
description = "Build production binary"
run = "go build {{vars.ldflags}} -o {{vars.bin_dir}}/lithos {{vars.cmd_path}}"
sources = ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum"]
outputs = ["{{vars.bin_dir}}/lithos"]

[tasks.dev]
alias = "d"
description = "Build dev binary with race detection"
run = '''
go build -race -gcflags='-N -l' -o {{vars.bin_dir}}/lithos {{vars.cmd_path}}
'''

[tasks."build:platform"]
description = "Build for a specific platform"
usage = '''
arg "<platform>" help="Target platform (GOOS)" {
  choices "darwin" "linux" "windows"
}
arg "<arch>" help="Target architecture (GOARCH)" default="amd64"
'''
run = '''
OUTPUT_NAME="{{vars.bin_dir}}/lithos-${usage_platform?}"
if [ "${usage_platform?}" = "windows" ]; then
  OUTPUT_NAME="${OUTPUT_NAME}.exe"
fi
echo "  📦 Building ${usage_platform?}/${usage_arch?}..."
GOOS=${usage_platform?} GOARCH=${usage_arch?} go build {{vars.ldflags}} \
  -o "$OUTPUT_NAME" {{vars.cmd_path}}
'''

[tasks."build:all"]
description = "Build for all platforms"
run = '''
echo "🚀 Building for all platforms..."
mkdir -p bin
mise run build:platform darwin amd64
mise run build:platform linux amd64
mise run build:platform windows amd64
echo "✅ Cross-platform build complete"
'''

[tasks."build:verify"]
description = "Validate build system and dependencies"
run = '''
echo "🚀 Validating build system..."
echo "  🔍 Validating Go workspace..."
go work sync 2>/dev/null || \
  echo "  ⚠️  No go.work file (expected for single module)"
echo "  🔍 Verifying build dependencies..."
go mod verify
echo "  🔍 Checking module resolution..."
go list all > /dev/null 2>&1 || echo "  ⚠️  Module resolution check skipped"
echo "✅ Build system validation complete"
'''


# -------------------------- Testing -------------------------- #
[tasks.test]
description = "Run all tests"
run = "go test ./..."
env = { GOFLAGS = "-count=1" }

[tasks."test:v"]
alias = "tv"
description = "Run tests verbosely"
run = "go test {{vars.go_test_flags}} ./..."

[tasks."test:cov"]
description = "Generate HTML coverage report"
run = [
  "mkdir -p {{vars.coverage_dir}}",
  "go test -coverprofile={{vars.coverage_out}} -covermode=atomic ./...",
  "go tool cover -html={{vars.coverage_out}} -o {{vars.coverage_html}}",
]

[tasks."test:int"]
description = "Run integration tests"
run = "go test -tags=integration ./tests/integration/..."

[tasks."test:security"]
description = "Run security tests"
run = "go test -tags=security ./tests/security/..."

[tasks."test:compliance"]
description = "Run compliance tests"
run = "go test -tags=compliance ./tests/compliance/..."

[tasks."test:artifacts"]
description = "Generate detailed coverage report with enhanced messaging"
run = '''
echo "🚀 Running tests with coverage..."
mkdir -p coverage
go test -coverprofile=coverage.out -covermode=atomic ./...
go tool cover -html=coverage.out -o coverage/coverage.html
echo "✅ Coverage report: coverage/coverage.html"
'''

[tasks."test:pkg"]
description = "Run tests for specific package"
usage = '''
arg "<package>" help="Package path to test"
'''
run = '''
echo "🧪 Testing package ${usage_package?}..."
go test -v ./${usage_package?}
'''

[tasks.bench]
description = "Run benchmarks with memory stats"
run = "go test -bench=. -benchmem ./..."


# -------------------- Performance Testing -------------------- #
[tasks."perf:test"]
description = "Run performance test (default: large=10k notes)"
run = '''
go test {{vars.go_test_flags}} -run {{vars.perf_test_name}} {{vars.perf_pkg}}
'''

[tasks."perf:bench"]
description = "Run benchmark for specified vault size"
usage = '''
arg "<size>" help="Vault size to benchmark" {
  choices "small" "medium" "large" "massive"
}
'''
run = '''
case ${usage_size?} in
  small)
    BENCH_NAME=BenchmarkSmallVault
    ;;
  medium)
    BENCH_NAME=BenchmarkMediumVault
    ;;
  large)
    BENCH_NAME=BenchmarkLargeVault
    ;;
  massive)
    BENCH_NAME=BenchmarkMassiveVault
    ;;
  *)
    echo "Invalid size: ${usage_size?}. Use: small, medium, large, massive"
    exit 1
    ;;
esac
echo "🧪 Running ${usage_size?} vault benchmark..."
go test -bench=$BENCH_NAME -benchmem {{vars.perf_pkg}}
'''

# Legacy aliases for backward compatibility
[tasks."perf:bench:small"]
description = "Run small vault benchmark (250 notes)"
run = "mise run perf:bench small"

[tasks."perf:bench:medium"]
description = "Run medium vault benchmark (2,500 notes)"
run = "mise run perf:bench medium"

[tasks."perf:bench:large"]
description = "Run large vault benchmark (10,000 notes)"
run = "mise run perf:bench large"

[tasks."perf:bench:massive"]
description = "Run massive vault benchmark (100,000 notes)"
run = "mise run perf:bench massive"


# ------------------- Performance Profiling ------------------- #
[tasks."perf:profile"]
description = "Generate profile of specified type"
usage = '''
arg "<type>" help="Profile type to generate" default="cpu" {
  choices "cpu" "mem" "block" "mutex" "trace"
}
'''
run = '''
case ${usage_type?} in
  cpu)
    FLAG="-cpuprofile={{vars.profile_dir}}/cpu.prof"
    ;;
  mem)
    FLAG="-memprofile={{vars.profile_dir}}/mem.prof"
    ;;
  block)
    FLAG="-blockprofile={{vars.profile_dir}}/block.prof"
    ;;
  mutex)
    FLAG="-mutexprofile={{vars.profile_dir}}/mutex.prof"
    ;;
  trace)
    FLAG="-trace={{vars.profile_dir}}/trace.out"
    ;;
  *)
    echo "Invalid type: ${usage_type?}. Use: cpu, mem, block, mutex, trace"
    exit 1
    ;;
esac
echo "🔍 Generating ${usage_type?} profile..."
mkdir -p {{vars.profile_dir}}
{{vars.prof_cmd_base}} $FLAG
'''

# Legacy aliases for backward compatibility
[tasks."perf:profile:cpu"]
description = "Generate CPU profile"
run = "mise run perf:profile cpu"
outputs = ["{{vars.profile_dir}}/cpu.prof"]

[tasks."perf:profile:mem"]
description = "Generate memory profile"
run = "mise run perf:profile mem"
outputs = ["{{vars.profile_dir}}/mem.prof"]

[tasks."perf:profile:block"]
description = "Generate block profile"
run = "mise run perf:profile block"
outputs = ["{{vars.profile_dir}}/block.prof"]

[tasks."perf:profile:mutex"]
description = "Generate mutex profile"
run = "mise run perf:profile mutex"
outputs = ["{{vars.profile_dir}}/mutex.prof"]

[tasks."perf:profile:trace"]
description = "Generate execution trace"
run = "mise run perf:profile trace"
outputs = ["{{vars.profile_dir}}/trace.out"]

[tasks."perf:profile:all"]
description = "Generate all profiles"
depends = [
  "perf:profile:cpu",
  "perf:profile:mem",
  "perf:profile:block",
  "perf:profile:mutex",
  "perf:profile:trace",
]


# ------------------- Performance Analysis -------------------- #
[tasks."perf:analyze"]
description = "Analyze profile of specified type"
usage = '''
arg "<type>" help="Profile type to analyze" default="cpu" {
  choices "cpu" "mem"
}
'''
run = '''
case ${usage_type?} in
  cpu)
    PROFILE_FILE="{{vars.profile_dir}}/cpu.prof"
    ;;
  mem)
    PROFILE_FILE="{{vars.profile_dir}}/mem.prof"
    ;;
  *)
    echo "Invalid type: ${usage_type?}. Use: cpu, mem"
    exit 1
    ;;
esac
if [ ! -f "$PROFILE_FILE" ]; then
  echo "❌ Profile not found. Run: mise run perf:profile:${usage_type?}"
  exit 1
fi
echo "📊 Analyzing ${usage_type?} profile..."
go tool pprof $PROFILE_FILE
'''

# Legacy aliases for backward compatibility
[tasks."perf:analyze:cpu"]
description = "Analyze CPU profile"
run = "mise run perf:analyze cpu"

[tasks."perf:analyze:mem"]
description = "Analyze memory profile"
run = "mise run perf:analyze mem"

[tasks."perf:report"]
description = "Generate text reports for profile type"
usage = '''
arg "<type>" help="Profile type to report on" default="cpu" {
  choices "cpu" "mem"
}
'''
run = '''
mkdir -p {{vars.report_dir}}
case ${usage_type?} in
  cpu)
    echo "📊 Generating CPU text reports..."
    go tool pprof -text {{vars.profile_dir}}/cpu.prof \
      > {{vars.report_dir}}/cpu-report.txt
    go tool pprof -top {{vars.profile_dir}}/cpu.prof \
      > {{vars.report_dir}}/cpu-top.txt
    ;;
  mem)
    echo "📊 Generating memory text reports..."
    go tool pprof -text {{vars.profile_dir}}/mem.prof \
      > {{vars.report_dir}}/mem-report.txt
    go tool pprof -top -alloc_space {{vars.profile_dir}}/mem.prof \
      > {{vars.report_dir}}/mem-alloc.txt
    go tool pprof -top -inuse_space {{vars.profile_dir}}/mem.prof \
      > {{vars.report_dir}}/mem-inuse.txt
    ;;
  *)
    echo "Invalid type: ${usage_type?}. Use: cpu, mem"
    exit 1
    ;;
esac
echo "✅ Reports generated in {{vars.report_dir}}"
'''

# Legacy aliases for backward compatibility
[tasks."perf:report:cpu"]
description = "Generate CPU text reports"
run = "mise run perf:report cpu"
outputs = [
  "{{vars.report_dir}}/cpu-report.txt",
  "{{vars.report_dir}}/cpu-top.txt",
]

[tasks."perf:report:mem"]
description = "Generate memory text reports"
run = "mise run perf:report mem"
outputs = [
  "{{vars.report_dir}}/mem-report.txt",
  "{{vars.report_dir}}/mem-alloc.txt",
  "{{vars.report_dir}}/mem-inuse.txt",
]


# -------------- Performance Baseline Comparison -------------- #
[tasks."perf:baseline"]
description = "Save performance baseline"
run = '''
mkdir -p {{vars.baseline_dir}}
TIMESTAMP=$(date +%Y%m%d_%H%M%S)
BASELINE_FILE="{{vars.baseline_dir}}/baseline_${TIMESTAMP}.txt"
{
  echo "Timestamp: $(date)"
  echo "Git commit: $(git rev-parse HEAD 2>/dev/null || echo 'unknown')"
  echo ""
} > "${BASELINE_FILE}"
go test {{vars.go_test_flags}} -run {{vars.perf_test_name}} \
  {{vars.perf_pkg}} 2>&1 | tee -a "${BASELINE_FILE}"
echo "✅ Baseline saved: ${BASELINE_FILE}"
'''

[tasks."perf:compare"]
description = "Compare current performance with latest baseline"
run = '''
LATEST=$(ls -t {{vars.baseline_dir}}/baseline_*.txt 2>/dev/null | head -1)
if [ -z "$LATEST" ]; then
  echo "❌ No baseline found. Run: mise run perf:baseline first"
  exit 1
fi
CURRENT="{{vars.baseline_dir}}/current_$(date +%Y%m%d_%H%M%S).txt"
echo "🔍 Running current performance test..."
go test {{vars.go_test_flags}} -run {{vars.perf_test_name}} \
  {{vars.perf_pkg}} 2>&1 | tee "${CURRENT}"
echo ""
echo "📊 Comparing with: $(basename "${LATEST}")"
echo ""
if diff "${LATEST}" "${CURRENT}" >/dev/null 2>&1; then
  echo "✅ No performance changes detected"
else
  echo "⚠️  Performance changes detected (see diff above)"
fi
'''


# ----------------------- Code Quality ------------------------ #
[tasks.format]
alias = "f"
description = "Format code. Formats all Go files in project"
run = '''
echo "🚀 Formatting code..."
golangci-lint fmt ./...
echo "✅ Formatting complete"
'''

[tasks.lint]
alias = "l"
description = "Lint and auto-fix. Lints and auto-fixes all Go files in project"
run = '''
echo "🔍 Linting code..."
golangci-lint run --fix ./...
echo "✅ Linting complete"
'''

[tasks.verify]
alias = "v"
description = "Format, lint, and test"
depends = ["format", "lint", "test"]

# ------------------------ Maintenance ------------------------ #
[tasks.clean]
description = "Remove build artifacts"
run = [
  "rm -rf bin/ dist/ {{vars.artifacts_dir}}",
  "rm -f *.coverprofile coverage.out",
  "go clean -cache",
]
