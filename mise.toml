# -----------------------------------------------------------------------------
# Filename:    lithos/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
# Core Runtime
rust = { version = "nightly-2026-01-11", profile = "default" }
pre-commit = "latest"

# Development Utilities
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:wasm-pack" = "latest"

# ------------------------------------------------------------- #
#                           SETTINGS                            #
# ------------------------------------------------------------- #
[settings]
experimental = true
# Automate tool installation and management
auto_install = true
not_found_auto_install = true
fetch_remote_versions_cache = "1h"
fetch_remote_versions_timeout = "10s"
use_versions_host = true
trusted_config_paths = ["{{config_root}}"]
lockfile = true

# ------------------------------------------------------------- #
#                       ENVIRONMENT                             #
# ------------------------------------------------------------- #
[env]
# Test configuration for ADR 0010 test utilities integration
TEST_THREADS = "4"
CARGO_TEST_ARGS = "--lib --bins"
TEST_OUTPUT_DIR = "{{config_root}}/test-output"
CI = "${GITHUB_ACTIONS:-false}"

# ------------------------------------------------------------- #
#                             Tasks                             #
# ------------------------------------------------------------- #

[tasks.fmt]
description = "Format all code"
run = ".mise/tasks/fmt.sh"

[tasks.lint]
description = "Run clippy linting"
run = ".mise/tasks/lint.sh"

[tasks.dev-setup]
description = "Bootstraps the development environment"
run = ".mise/tasks/dev-setup.sh"

[tasks.quality]
description = "Run all quality gates (fmt, lint, validate-adrs)"
depends = ["fmt", "lint", "validate-adrs"]

[tasks.test]
description = "Run all tests (unit and integration)"
alias = "t"
depends = ["test:unit", "test:integration"]

# Specific crate unit tests for developer convenience
[tasks."test:unit:domain"]
description = "Run domain crate unit tests"
run = ".mise/tasks/test/unit.sh -p domain"

[tasks."test:unit:app"]
description = "Run app crate unit tests"
run = ".mise/tasks/test/unit.sh -p app"

[tasks."test:unit:adapters"]
description = "Run adapters crate unit tests"
run = ".mise/tasks/test/unit.sh -p adapters"

[tasks."test:unit:cli"]
description = "Run CLI crate unit tests"
run = ".mise/tasks/test/unit.sh -p cli"

# CI/CD simulation
[tasks.ci]
description = "Simulate CI/CD pipeline"
depends = ["verify", "test:integration"]

[tasks.verify]
description = "Full quality gate orchestration"
alias = "v"
depends = ["fmt", "lint", "test", "deny"]

[tasks.deny]
description = "Check dependencies for security vulnerabilities and license compliance"
run = "cargo deny check"

[tasks.validate-adrs]
description = "Validate ADRs for template compliance"
run = "scripts/validate-adrs.sh"

[tasks.adr-metrics]
description = "Show ADR quality and completeness metrics"
run = "scripts/adr-metrics.sh"

[tasks.bench]
description = "Run performance benchmarks"
run = ".mise/tasks/test/bench.sh"
