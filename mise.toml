# -----------------------------------------------------------------------------
# Filename:     lithos/mise.toml
# Docs:         https://mise.jdx.dev/
# Description:
# -----------------------------------------------------------------------------

# ------------------------------------------------------------ #
#                             Tools                            #
# ------------------------------------------------------------ #
[tools]
go = "latest"
golangci-lint = "latest"


# ------------------------------------------------------------ #
#                          Environment                         #
# ------------------------------------------------------------ #
[env]
# GO111MODULE = "on"

# If you have private org modules:
# GOPRIVATE = "github.com/your-org/*"

# Keep binaries in-repo (helps CI and avoids polluting global GOPATH/bin)
GOBIN = "{{config_root}}/bin"

# Put that bin on PATH
PATH = "{{config_root}}/bin:{{env.PATH}}"
# Centralized location for coverage, benchmark, and perf artifacts
ARTIFACTS_DIR = "{{config_root}}/tests/artifacts"

# ------------------------------------------------------------ #
#                           Settings                           #
# ------------------------------------------------------------ #
[settings]
# 1. Install what’s missing when entering the repo or running tasks
auto_install = true

# 2. Make “command not found → install” work (nice for new devs)
not_found_auto_install = true

# 3. Keep remote version checks reasonably fast
fetch_remote_versions_cache = "1h"
fetch_remote_versions_timeout = "10s"
use_versions_host = true

# 4. Trust this repo so people aren’t prompted every time (optional)
trusted_config_paths = ["{{config_root}}"]

# 5. We want to actually write a lockfile so CI gets the same versions
lockfile = true

# ------------------- Go-specific Settings ------------------- #
# make sure GOROOT is set from the tool you installed
go_set_goroot = true

# set GOBIN automatically (we also set it in [env], this just reinforces)
go_set_gobin = true

# optional: if you keep a list of Go tools to auto-install, point to it
# default_packages_file = "{{config_root}}/.default-go-packages"

# If you’re in a region where Google’s mirror is slow, change this:
go_download_mirror = "https://dl.google.com/go"


# ------------------------------------------------------------ #
#                             Tasks                            #
# ------------------------------------------------------------ #
# run with: `mise run build`, `mise run test`, ...

# -------------------- Build Tasks -------------------- #

[tasks.build]
description = "Build production binary with optimizations"
run = """
mkdir -p bin
go build -ldflags="-s -w" -o bin/lithos ./cmd/lithos
echo "✅ Production build complete: bin/lithos"
"""

[tasks.build-dev]
description = "Build development binary with race detection"
run = """
mkdir -p bin
go build -race -gcflags="-N -l" -o bin/lithos ./cmd/lithos
echo "✅ Development build complete (race detection enabled)"
"""

[tasks.build-all]
description = "Build binaries for Darwin, Linux, and Windows"
run = """
mkdir -p bin
echo "🚀 Building for all platforms..."
GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/lithos-darwin ./cmd/lithos
GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/lithos-linux ./cmd/lithos
GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/lithos-windows.exe ./cmd/lithos
echo "✅ Cross-platform build complete"
"""

[tasks.verify-build]
description = "Validate Go workspace, dependencies, and module resolution"
run = """
echo "🚀 Validating build system..."
go work sync
go mod verify
go list -m all > /dev/null
echo "✅ Build system validation complete"
"""

# -------------------- Testing Tasks -------------------- #

[tasks.test]
description = "Run all unit tests"
run = """
echo "🧪 Running tests..."
go test ./...
echo "✅ Tests complete"
"""

[tasks.test.env]
GOFLAGS = "-count=1"

[tasks.test-integration]
description = "Run integration tests with build tag"
run = """
echo "🧪 Running integration tests..."
go test -tags=integration ./tests/integration/...
echo "✅ Integration tests complete"
"""

[tasks.test-coverage]
description = "Run all tests with inline coverage percentage"
run = """
echo "🧪 Running tests with coverage..."
go test -cover ./...
echo "✅ Coverage analysis complete"
"""

[tasks.test-artifacts]
description = "Generate detailed HTML coverage report"
run = """
ARTIFACTS_DIR=${ARTIFACTS_DIR:-tests/artifacts}
COVERAGE_DIR="${ARTIFACTS_DIR}/coverage"
PROFILE="${COVERAGE_DIR}/coverage.out"
echo "🚀 Running tests with coverage..."
mkdir -p "${COVERAGE_DIR}"
go test -coverprofile="${PROFILE}" -covermode=atomic ./...
go tool cover -html="${PROFILE}" -o "${COVERAGE_DIR}/coverage.html"
echo "✅ Coverage report generated: ${COVERAGE_DIR}/coverage.html"
"""

[tasks.test-pkg]
description = "Run tests for specific package with verbose output (usage: mise run test-pkg -- <package>)"
run = """
if [ -z "$1" ]; then
  echo "❌ Error: Package path required"
  echo "Usage: mise run test-pkg -- internal/domain"
  exit 1
fi
echo "🧪 Testing package $1..."
go test -v ./$1
"""

# -------------------- Benchmark & Performance Tasks -------------------- #

[tasks.bench]
description = "Run benchmark tests with memory allocation stats"
run = """
echo "⚡ Running benchmarks..."
go test -bench=. -benchmem ./...
echo "✅ Benchmarks complete"
"""

[tasks.bench-performance]
description = "Run performance benchmarks from tests/performance/"
run = """
echo "⚡ Running performance benchmarks..."
go test -bench=. -benchmem -benchtime=5s ./tests/performance/...
echo "✅ Performance benchmarks complete"
"""

[tasks.perf-validate]
description = "Sprint 0: Validate performance with production vault data"
run = """
ARTIFACTS_DIR=${ARTIFACTS_DIR:-tests/artifacts}
PERF_DIR="${ARTIFACTS_DIR}/performance"
echo "🚀 Sprint 0: Performance Validation"
echo ""
echo "📊 Step 1: Creating large test vault (500+ notes)..."
mkdir -p testdata/vault-large/
if [ -d "docs/refs/obsidian" ]; then
  find docs/refs/obsidian/ -name "*.md" | head -500 | while read file; do
    target_dir="testdata/vault-large/$(dirname "${file#docs/refs/obsidian/}")"
    mkdir -p "$target_dir"
    cp "$file" "$target_dir/"
  done
  echo "✅ Test vault created with $(find testdata/vault-large/ -name "*.md" | wc -l | tr -d ' ') notes"
else
  echo "⚠️  Production vault not found at docs/refs/obsidian/"
  echo "   Using existing testdata/vault/ instead"
fi
echo ""
echo "⚡ Step 2: Running performance benchmarks..."
mkdir -p "${PERF_DIR}"
go test -bench=. -benchmem -benchtime=5s ./tests/performance/... 2>&1 | tee "${PERF_DIR}/performance-results.txt"
echo ""
echo "📈 Step 3: Performance targets validation:"
echo "   ✓ Template rendering: <300ms (PRD requirement)"
echo "   ✓ BoltDB hot cache: <1ms per lookup"
echo "   ✓ SQLite deep storage: <50ms per query"
echo "   ✓ Full vault indexing: <5s for 1000+ notes"
echo ""
echo "✅ Performance validation complete - Results saved to ${PERF_DIR}/performance-results.txt"
"""

[tasks.perf-index]
description = "Time full vault indexing performance"
run = """
if [ ! -f "bin/lithos" ]; then
  echo "🔨 Building lithos binary first..."
  mise run build
fi
echo "⚡ Testing vault indexing performance..."
time ./bin/lithos index --vault=testdata/vault-large/
echo ""
echo "✅ Indexing performance test complete"
"""

# -------------------- Quality Tasks -------------------- #

[tasks.format]
description = "Format all code with golangci-lint"
run = """
echo "🎨 Formatting code..."
golangci-lint fmt ./...
echo "✅ Formatting complete"
"""

[tasks.lint]
description = "Lint code and auto-fix issues"
run = """
echo "🔍 Linting code..."
golangci-lint run --fix ./...
echo "✅ Linting complete"
"""

[tasks.verify]
description = "Run format, lint, and test in sequence"
depends = ["format", "lint", "test"]
run = """
echo "✅ All quality checks passed"
"""

# -------------------- Setup Tasks -------------------- #

[tasks.setup]
description = "Setup development environment and download dependencies"
run = """
echo "🚀 Setting up development environment..."
go mod download
echo "ℹ️  Installing tools from go.mod..."
go mod download -x
echo "✅ Development environment ready"
echo "ℹ️  Tools available via: go run <tool-import-path>"
"""

[tasks.setup-pre-commit]
description = "Install pre-commit and setup Git hooks"
run = """
if command -v pre-commit >/dev/null 2>&1; then
  pre-commit install
  echo "✅ Pre-commit hooks installed"
else
  echo "⚠️  pre-commit not found. Install with: uv pip install pre-commit"
  exit 1
fi
"""

# -------------------- Maintenance Tasks -------------------- #

[tasks.clean]
description = "Remove all build artifacts and Go cache"
run = """
echo "🧹 Cleaning build artifacts..."
rm -rf bin/
rm -rf dist/
rm -rf coverage/
rm -rf tests/artifacts/
rm -f *.coverprofile coverage.out
go clean -cache
echo "✅ Clean complete"
"""

# -------------------- Sprint 0 Tasks -------------------- #

[tasks.sprint0]
description = "Complete Sprint 0: Performance validation and chaos testing prep"
run = """
echo "🚀 Sprint 0: System-Level Testability Validation"
echo "=================================================="
echo ""
echo "📋 Phase 1: Performance Validation"
echo "-----------------------------------"
mise run perf-validate
echo ""
echo "📋 Phase 2: Test Coverage Check"
echo "--------------------------------"
mise run test-coverage
echo ""
echo "📋 Phase 3: Quality Gates"
echo "-------------------------"
mise run verify
echo ""
echo "📋 Phase 4: Documentation Update"
echo "---------------------------------"
echo "✓ System-level test design generated: _bmad-output/test-design-system.md"
echo "✓ Performance results saved: tests/artifacts/performance/performance-results.txt"
echo ""
echo "✅ Sprint 0 Complete - Ready for Implementation Readiness Gate"
echo ""
echo "Next Steps:"
echo "  1. Review performance results in tests/artifacts/performance/performance-results.txt"
echo "  2. Verify coverage meets targets (≥85% internal/app, ≥80% overall)"
echo "  3. Proceed to: /bmad:bmm:workflows:implementation-readiness"
"""
