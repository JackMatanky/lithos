# -----------------------------------------------------------------------------
# Filename:    lithos/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Workspace manifest for the Lithos Rust project, defining
#              package metadata, dependencies, and workspace-wide lints.
# -----------------------------------------------------------------------------

[workspace]
members = ["lithos-core", "lithos-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Jack"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jack/lithos"
description = "A CLI-first templating and schema system for Obsidian vaults"

[workspace.dependencies]
# Async & Runtime
tokio = { version = "1.49", features = ["macros"] }
async-trait = "0.1"
rayon = "1.10"

# API & CLI
clap = { version = "4.5", features = ["env"] }
miette = { version = "7.6", features = ["fancy"] }

# Data & Persistence
redb = "4.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml = "0.9"
toml = "0.8"
rkyv = { version = "0.8", features = [
  "bytecheck",
  "std",
  "uuid-1",
  "unaligned",
] }
uuid = { version = "1.19", features = ["v7", "v5", "serde"] }

# Application Logic
minijinja = "2.14"
pulldown-cmark = "0.13"
figment = { version = "0.10", features = ["toml", "env"] }
# anyhow = "1.0"  # Completely unused - codebase uses thiserror exclusively
thiserror = "2.0"
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
convert_case = "0.10"
slug = "0.1"
base64 = "0.22"
rand = "0.8"
blake3 = "1.6"
regex = "1.11"
walkdir = "2.5"
glob = "0.3"

# Testing & Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
dhat = "0.3"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
mockall = "0.13"
proptest = "1.5"
rstest = "0.23"

# Internal Workspace Crates
lithos-core = { path = "lithos-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# ------------------------------------------------------------- #
#                        Lint Categories                        #
# ------------------------------------------------------------- #
# Note: `correctness` is deny by default. The `restriction` group is explicitly omitted.
#       `complexity` and `perf` are defined as deny for elevated guardrails.
# `correctness`: code that is outright wrong or useless. (default: deny)
# `suspicious`: code that is most likely wrong or useless. (default: warn)
# `style`: code that should be written in a more idiomatic way. (default: warn)
# `complexity`: code that does something simple but in a complex way (default: warn)
complexity = { level = "deny", priority = -1 }
# `perf`: code that can be written to run faster (default: warn)
perf = { level = "deny", priority = -1 }
# `pedantic`: lints which are rather strict or have occasional false positives (default: allow)
pedantic = { level = "warn", priority = -1 }
# `restriction`: lints which prevent the use of language and library features (default: allow)
# `nursery`: new lints that are still under development (default: allow)
# `cargo`: lints for the cargo manifest (default: allow)
cargo = { level = "warn", priority = -1 }

# ------------------------------------------------------------- #
#              Allowed (Exceptions & Relaxations)               #
# ------------------------------------------------------------- #

# -------------------- Style & Formatting --------------------- #
absolute_paths = "allow"             # Permits absolute paths to clarify external type origins.
pub_with_shorthand = "allow"         # Permits `pub(crate)` shorthand over `pub(in crate)` for cleaner visibility.
semicolon_inside_block = "allow"     # Prefers semicolons outside block expressions for visual consistency.
unseparated_literal_suffix = "allow" # Permits numeric suffixes without underscores (e.g., 1u32) for small literals.

# ----------------- Structure & Architecture ------------------ #
mod_module_files = "allow"     # Permits both `mod.rs` and `folder/mod.rs` module conventions.
std_instead_of_alloc = "allow" # Permits `std` library types instead of `alloc` for std environments.
std_instead_of_core = "allow"  # Permits `std` library types instead of `core` for std environments.

# --------------------- Idioms & Patterns --------------------- #
implicit_return = "allow"    # Permits omitting `return` to embrace idiomatic trailing expressions.
question_mark_used = "allow" # Permits `?` for error propagation instead of explicit matching.
shadow_reuse = "allow"       # Permits shadowing when transforming data (e.g., `let x = x.trim()`).
shadow_same = "allow"        # Permits shadowing with the same name/type to rebind immutables as mutable.
single_call_fn = "allow"     # Permits single-call functions to encourage logical modularization.

# ------------------ Documentation & Naming ------------------- #
min_ident_chars = "allow"               # Permits short variable names (like `i`, `x`) standard in tight algorithms.
missing_docs_in_private_items = "allow" # Avoids maintenance overhead of requiring docs for internal details.

# --------------------- Output & Logging ---------------------- #
print_stderr = "allow" # Permits `eprintln!` for direct stderr output, useful in CLI tools.

# ------------------------------------------------------------- #
#            Warnings (Best Practices & Suggestions)            #
# ------------------------------------------------------------- #

# ------------------- Architecture & Types -------------------- #
# Restriction lints elevated to warn to enforce explicit API design
as_conversions = "warn"                 # Flags `as` casts to encourage safer explicit `.try_into()` conversions.
else_if_without_else = "warn"           # Encourages exhaustive `if/else` chains so edge cases aren't ignored.
format_push_string = "warn"             # Recommends `write!` into a buffer over temporary `push_str(&format!(..))`.
impl_trait_in_params = "warn"           # Prefers `impl Trait` arguments to enforce faster static dispatch.
missing_inline_in_public_items = "warn" # Suggests `#[inline]` on public items to aid cross-crate LTO performance.

# ------------------------------------------------------------- #
#                 Denials (Strict Enforcements)                 #
# ------------------------------------------------------------- #

# ---------------------- Error Handling ----------------------- #
# Restriction lints elevated to deny to ban sloppy error handling
exit = "deny"               # Forbids `std::process::exit` to ensure graceful shutdown and error propagation.
expect_used = "deny"        # Forbids `.expect()` to force robust error handling instead of panicking.
panic = "deny"              # Forbids explicit `panic!` to ensure the CLI degrades gracefully.
panic_in_result_fn = "deny" # Prevents hidden panics in `Result` functions, maintaining API safety.
todo = "deny"               # Forbids `todo!` macro in committed code to ensure feature completeness.
unimplemented = "deny"      # Forbids `unimplemented!` to prevent shipping half-finished code paths.
unreachable = "deny"        # Forbids `unreachable!` to prevent runtime crashes on invariant breaks.
unwrap_used = "deny"        # Forbids `.unwrap()` to enforce strict `Result` matching and error propagation.

# ----------------------- Documentation ----------------------- #
# Restriction lints elevated to deny to ensure complete API docs
missing_errors_doc = "deny"         # Requires docs for functions returning `Result` to show exact failure modes.
missing_panics_doc = "deny"         # Requires documentation for any panicking code to clearly surface API risks.
undocumented_unsafe_blocks = "deny" # Requires `// SAFETY:` comments on `unsafe` blocks to document contracts.

# ------------------ Elevated Pedantic Lints ------------------ #
fn_params_excessive_bools = "deny"   # Limits boolean parameters to prevent confusing call sites.
large_types_passed_by_value = "deny" # Prevents copying large structs on the stack, forcing pass-by-reference.
struct_excessive_bools = "deny"      # Limits boolean fields in structs to encourage explicit state machine enums.
too_many_lines = "deny"              # Limits function length to encourage modular, single-responsibility functions.
unused_self = "deny"                 # Flags unused `self` parameters to suggest associated functions.

# ---------------- Clean Code & Anti-Patterns ----------------- #
allow_attributes_without_reason = "deny" # Forces `#![allow(...)]` to have a `reason` so exceptions are understood.
arithmetic_side_effects = "deny"         # Prevents unexpected integer overflow/underflow, enforcing safe math.
as_pointer_underscore = "deny"           # Forbids `as _` pointer casts to explicitly define the target pointer type.
as_underscore = "deny"                   # Forbids `as _` casts to explicitly define the target numeric type.
dbg_macro = "deny"                       # Forbids leaving `dbg!` in committed code to keep standard output clean.
disallowed_methods = "deny"              # Enforces project-specific bans defined in the `clippy.toml` configuration.
indexing_slicing = "deny"                # Forbids `arr[index]` to prevent out-of-bounds panics, forcing `.get()`.
print_stdout = "deny"                    # Prevents rogue `println!` usage, forcing the `tracing` logging framework.
shadow_unrelated = "deny"                # Forbids shadowing a variable with a completely different type/concept.
str_to_string = "deny"                   # Prefers `.to_owned()` on string literals to clarify cloning intent.

[profile.release]
opt-level = 3
lto = "fat"       # OPTIMIZED: Full LTO for maximum binary size reduction
codegen-units = 1 # OPTIMIZED: Maximum optimization per compilation unit
panic = "abort"   # OPTIMIZED: Remove panic handling overhead
strip = "symbols" # OPTIMIZED: Remove debug symbols

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "packed"

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "packed"
inherits = "dev"
