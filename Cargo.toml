# -----------------------------------------------------------------------------
# Filename:    lithos/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Workspace manifest for the Lithos Rust project, defining
#              package metadata, dependencies, and workspace-wide lints.
# -----------------------------------------------------------------------------

[workspace]
members = ["lithos-core", "lithos-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Jack"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jack/lithos-rust"
description = "A CLI-first templating and schema system for Obsidian vaults"

[workspace.dependencies]
# Core Runtime
tokio = { version = "1.49", features = ["macros"] }
async-trait = "0.1"
rayon = "1.10"

# API & CLI
clap = { version = "4.5", features = ["env"] }
miette = { version = "7.6", features = ["fancy"] }

# Data & Persistence
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml = "0.9"
toml = "0.8"
redb = "3.1"
rkyv = { version = "0.8", features = ["bytecheck", "std", "uuid-1", "unaligned"] }
uuid = { version = "1.19", features = ["v7", "v5", "serde"] }

# Application Logic
minijinja = "2.14"
pulldown-cmark = "0.13"
figment = { version = "0.10", features = ["toml", "env"] }
# anyhow = "1.0"  # Completely unused - codebase uses thiserror exclusively
thiserror = "2.0"
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
convert_case = "0.10"
slug = "0.1"
base64 = "0.22"
rand = "0.8"
blake3 = "1.6"
regex = "1.11"
walkdir = "2.5"
glob = "0.3"

# Testing & Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
dhat = "0.3"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
mockall = "0.13"
proptest = "1.5"
rstest = "0.23"

# Internal Workspace Crates
lithos-core = { path = "lithos-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# --- Category Groups ---
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# --- Allow Overrides (Exceptions to Pedantic/Restriction) ---
blanket_clippy_restriction_lints = "allow"
unseparated_literal_suffix = "allow"
implicit_return = "allow"
question_mark_used = "allow"
single_call_fn = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
print_stderr = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
absolute_paths = "allow"
mod_module_files = "allow"
pub_with_shorthand = "allow"


# --- Warn Overrides (Best Practices) ---
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
missing_inline_in_public_items = "warn"
else_if_without_else = "warn"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
undocumented_unsafe_blocks = "deny"
panic_in_result_fn = "deny"
exit = "deny"
print_stdout = "deny"
shadow_unrelated = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
excessive_nesting = "deny"
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
large_enum_variant = "deny"
result_large_err = "deny"
large_types_passed_by_value = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unused_self = "deny"
str_to_string = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
disallowed_methods = "deny"

# --- Performance & Zero-Copy Lints ---
# Reuses existing heap capacity with a.clone_from(&b) instead of reallocating.
assigning_clones = "deny"
# Detects redundant allocations like &Box<T> or Box<Arc<T>>.
redundant_allocation = "deny"
# Flags .collect::<Vec<_>>() when lazy iteration is sufficient.
needless_collect = "deny"
# Detects vec![...] that is immediately sliced, avoiding a heap allocation.
useless_vec = "deny"
# Prefers 'c' over "c" in string methods for faster character searching.
single_char_pattern = "deny"
# Uses Atomic* types instead of Mutex<T> for small primitives (lower overhead).
mutex_atomic = "deny"
# Ensures RwLock write locks are only used when mutation actually occurs.
readonly_write_lock = "deny"
# Replaces contains_key + insert with entry to avoid double lookups.
map_entry = "deny"
# Suggests push over push_str for single characters to avoid string parsing.
string_extend_chars = "deny"
# Prefers String::new() over "".to_string() to avoid unnecessary allocation.
manual_string_new = "deny"
# Prevents Box<Vec<T>> or Box<String> which adds double heap indirection.
box_collection = "deny"
# Use .any() instead of .find().is_some() for clearer optimization intent.
search_is_some = "deny"
# Prefers .cloned()/.copied() over manual closures for internal optimizations.
map_clone = "deny"
# Prevents nested format! calls inside println!, avoiding temporary strings.
format_in_format_args = "deny"
# Uses Display implementation directly instead of calling .to_string().
to_string_in_format_args = "deny"
# Detects .to_owned()/.to_string() when a reference or Cow would suffice.
unnecessary_to_owned = "deny"
# Flags .to_string() on types with more efficient display or conversion paths.
inefficient_to_string = "deny"

# --- Performance & Optimization (Warn) ---
# Passes small Copy types (like Id) by value to improve register usage.
trivially_copy_pass_by_ref = "warn"
# Minimizes lock critical sections to reduce thread contention.
significant_drop_tightening = "warn"
# Move .cloned() calls after .take(n) to avoid unnecessary clones.
iter_overeager_cloned = "warn"
# Suggests Vec::with_capacity() or vec![...] instead of new() + push().
vec_init_then_push = "warn"
# Detects suboptimal patterns (e.g., manual loops) for resizing vectors.
slow_vector_initialization = "warn"
# Moves large arrays to the heap or static to avoid stack overflows.
large_stack_arrays = "warn"
# Replaces manual nested loops with the more optimized .flatten() iterator.
manual_flatten = "warn"
# Uses let-else to flatten error paths and improve branch predictability.
manual_let_else = "warn"
# Prefers impl Trait over Box<dyn Trait> for static dispatch performance.
impl_trait_in_params = "warn"
# Uses write! macro into a String instead of push_str(&format!(..)).
format_push_string = "warn"

[profile.release]
opt-level = 3
lto = "fat"           # OPTIMIZED: Full LTO for maximum binary size reduction
codegen-units = 1       # OPTIMIZED: Maximum optimization per compilation unit
panic = "abort"         # OPTIMIZED: Remove panic handling overhead
strip = "symbols"        # OPTIMIZED: Remove debug symbols

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "packed"

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "packed"
inherits = "dev"
