# -----------------------------------------------------------------------------
# Filename:    lithos/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Workspace manifest for the Lithos Rust project, defining
#              package metadata, dependencies, and workspace-wide lints.
# -----------------------------------------------------------------------------

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Jack"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jack/lithos-rust"
description = "A CLI-first templating and schema system for Obsidian vaults"

[workspace.dependencies]
# Core Runtime
tokio = { version = "1.49", features = ["full"] }
async-trait = "0.1"

# API & CLI
clap = { version = "4.5", features = ["derive", "env"] }
miette = { version = "7.6", features = ["fancy"] }

# Data & Persistence
serde = { version = "1.0", features = ["derive"] }
redb = "3.1"
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
uuid = { version = "1.19", features = ["v7", "serde"] }

# Application Logic
minijinja = "2.14"
pulldown-cmark = "0.13"
figment = { version = "0.10", features = ["toml", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
convert_case = "0.10"
slug = "0.1"
base64 = "0.22"
rand = "0.10"

# Internal Workspace Crates
lithos-domain = { path = "crates/domain" }
lithos-app = { path = "crates/app" }
lithos-adapters = { path = "crates/adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
blanket_clippy_restriction_lints = "allow"
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# Exceptions to restriction group (common opinionated lints to ignore)
unseparated_literal_suffix = "allow"
implicit_return = "allow"
question_mark_used = "allow"
single_call_fn = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
print_stdout = "allow"
print_stderr = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
absolute_paths = "allow"
mod_module_files = "allow"
pub_with_shorthand = "allow"

correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
