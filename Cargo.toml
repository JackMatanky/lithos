# -----------------------------------------------------------------------------
# Filename:    lithos/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Workspace manifest for the Lithos Rust project, defining
#              package metadata, dependencies, and workspace-wide lints.
# -----------------------------------------------------------------------------

[workspace]
members = ["crates/*", "tests/*", "benches"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Jack"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jack/lithos-rust"
description = "A CLI-first templating and schema system for Obsidian vaults"

[workspace.dependencies]
# Core Runtime
tokio = { version = "1.49", features = ["full"] }
async-trait = "0.1"

# API & CLI
clap = { version = "4.5", features = ["derive", "env"] }
miette = { version = "7.6", features = ["fancy"] }

# Data & Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
redb = "3.1"
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
uuid = { version = "1.19", features = ["v7", "v5", "serde"] }

# Application Logic
minijinja = "2.14"
pulldown-cmark = "0.13"
figment = { version = "0.10", features = ["toml", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
convert_case = "0.10"
slug = "0.1"
base64 = "0.22"
rand = "0.10"
blake3 = "1.6"
regex = "1.11"

# Testing & Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
dhat = "0.3"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
mockall = "0.13"
proptest = "1.5"
rstest = "0.23"

# Internal Workspace Crates
lithos-domain = { path = "crates/domain" }
lithos-app = { path = "crates/app" }
lithos-adapters = { path = "crates/adapters" }
lithos-test-utils = { path = "tests/utils" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# --- Category Groups ---
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# --- Allow Overrides (Exceptions to Pedantic/Restriction) ---
blanket_clippy_restriction_lints = "allow"
unseparated_literal_suffix = "allow"
implicit_return = "allow"
question_mark_used = "allow"
single_call_fn = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
print_stderr = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
absolute_paths = "allow"
mod_module_files = "allow"
pub_with_shorthand = "allow"


# --- Warn Overrides (Best Practices) ---
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
missing_inline_in_public_items = "warn"
else_if_without_else = "warn"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
undocumented_unsafe_blocks = "deny"
panic_in_result_fn = "deny"
exit = "deny"
print_stdout = "deny"
shadow_unrelated = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
excessive_nesting = "deny"
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
large_enum_variant = "deny"
result_large_err = "deny"
large_types_passed_by_value = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unused_self = "deny"
str_to_string = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true
inherits = "dev"
