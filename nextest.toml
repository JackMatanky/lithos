[profile.default]
retries = 1
# Integration tests might take longer, but we aim for <30s total
slow-timeout = { period = "60s", terminate-after = 2 }
# Show failure output immediately for faster feedback
failure-output = "immediate-final"
# Status updates for long-running tests
status-level = "fail"

[profile.ci]
retries = 3
slow-timeout = { period = "120s", terminate-after = 3 }
failure-output = "final"
status-level = "all"

[profile.fast]
# Ultra-fast profile for development iteration
retries = 0
slow-timeout = { period = "10s", terminate-after = 1 }
failure-output = "immediate"
status-level = "fail"

[test-groups]
# Prevent overlapping E2E tests if they use shared resources (though we use TempDir)
e2e = { max-threads = 1 }
# Database tests can run in parallel but mark as slow
db = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(e2e::)'
test-group = 'e2e'

[[profile.default.overrides]]
# Mark database tests as slow for filtering
filter = 'test(db) | test(persistence) | test(Database)'
slow = true
test-group = 'db'

[[profile.default.overrides]]
# Property-based tests need more time
filter = 'test(proptest)'
slow-timeout = { period = "120s", terminate-after = 1 }
