[profile.default]
retries = 1
# Integration tests might take longer, but we aim for <30s total
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
retries = 3
slow-timeout = { period = "120s", terminate-after = 3 }

[test-groups]
# Prevent overlapping E2E tests if they use shared resources (though we use TempDir)
e2e = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(e2e::)'
test-group = 'e2e'
