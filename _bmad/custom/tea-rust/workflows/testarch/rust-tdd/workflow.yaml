# Tea-Rust workflow: rust-tdd
name: tea-rust-tdd
description: "Rust TDD workflow for new implementations with red-green-refactor discipline"
author: "Tea-Rust"

# Critical variables from config
config_source: "{project-root}/_bmad/custom/tea-rust/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/_bmad/custom/tea-rust/workflows/testarch/rust-tdd"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: "{installed_path}/templates/tdd-plan-template.md"

# Variables and inputs
variables:
  target_scope: "auto" # file/module/multi-module/project
  story_path: "" # optional story input

# Output configuration
default_output_file: "{output_folder}/tea-rust/tdd-plan.md"

# Required tools
required_tools:
  - read_file
  - write_file
  - list_files
  - search_repo
  - glob

tags:
  - rust
  - tdd
  - quality
  - test-architecture

execution_hints:
  interactive: true
  autonomous: true
  iterative: true
