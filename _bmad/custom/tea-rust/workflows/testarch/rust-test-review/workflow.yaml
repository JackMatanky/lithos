# Tea-Rust workflow: rust-test-review
name: tea-rust-test-review
description: "Senior-dev test review workflow focused on Rust quality gates"
author: "Tea-Rust"

config_source: "{project-root}/_bmad/custom/tea-rust/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
test_review_output: "{config_source}:test_review_output"
date: system-generated

installed_path: "{project-root}/_bmad/custom/tea-rust/workflows/testarch/rust-test-review"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: "{installed_path}/templates/review-report-template.md"

variables:
  review_scope: "single" # single, directory, suite
  target_path: ""

default_output_file: "{test_review_output}/rust-test-review.md"

required_tools:
  - read_file
  - write_file
  - list_files
  - search_repo
  - glob

tags:
  - rust
  - test-review
  - quality

execution_hints:
  interactive: false
  autonomous: true
  iterative: true
