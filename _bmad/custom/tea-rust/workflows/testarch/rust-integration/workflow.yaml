# Tea-Rust workflow: rust-integration
name: tea-rust-integration
description: "Integration and E2E testing workflow for Rust systems"
author: "Tea-Rust"

config_source: "{project-root}/_bmad/custom/tea-rust/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
integration_output: "{config_source}:integration_output"
date: system-generated

installed_path: "{project-root}/_bmad/custom/tea-rust/workflows/testarch/rust-integration"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

variables:
  target_scope: "auto"
  components: []

default_output_file: "{integration_output}/rust-integration-plan.md"


required_tools:
  - read_file
  - write_file
  - list_files
  - search_repo
  - glob

tags:
  - rust
  - integration
  - e2e

execution_hints:
  interactive: true
  autonomous: true
  iterative: true
