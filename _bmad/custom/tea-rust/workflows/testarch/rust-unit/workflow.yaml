# Tea-Rust workflow: rust-unit
name: tea-rust-unit
description: "Comprehensive unit testing workflow for existing Rust code"
author: "Tea-Rust"

config_source: "{project-root}/_bmad/custom/tea-rust/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "{project-root}/_bmad/custom/tea-rust/workflows/testarch/rust-unit"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: "{installed_path}/templates/unit-plan-template.md"

variables:
  target_scope: "auto"
  target_path: ""

default_output_file: "{output_folder}/tea-rust/unit-test-plan.md"

required_tools:
  - read_file
  - write_file
  - list_files
  - search_repo
  - glob

tags:
  - rust
  - unit-tests
  - quality

execution_hints:
  interactive: true
  autonomous: true
  iterative: true
