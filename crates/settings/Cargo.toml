[package]
name = "traces-settings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
redb.workspace = true
rkyv.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
toml.workspace = true
base64.workspace = true
dirs.workspace = true
regex.workspace = true

traces-db = { path = "../db" }
traces-support = { path = "../support" }
traces-fs = { path = "../fs" }
traces-utils = { path = "../utils" }

[features]
testing = ["traces-db/testing"]
# `serde_json` is already a non-optional dependency (used unconditionally in
# `config/value.rs` and `config/processor.rs`), so the `json` feature only gates
# the deserialization arm rather than pulling in the dependency.
json = []
yaml = ["dep:serde_yaml"]

[lints]
workspace = true

[dev-dependencies]
glob = "0.3.3"
rstest.workspace = true
tempfile.workspace = true
mockall.workspace = true
pretty_assertions.workspace = true
traces-db = { path = "../db", features = ["testing"] }
