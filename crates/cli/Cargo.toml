[package]
name = "trace-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "trace-cli"
path = "src/main.rs"
bench = false

[dependencies]

trace-app.workspace = true
trace-settings = { workspace = true, features = ["testing"] }
trace-fs.workspace = true

clap = { version = "4.6", features = ["env", "derive"] }
miette = { workspace = true, features = ["fancy"] }
thiserror.workspace = true
# anyhow.workspace = true  # COMMENTED: Completely unused - codebase uses thiserror exclusively
tracing.workspace = true
rkyv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Note: tokio removed per Phase 5 - sync-first design
# If async is needed later for parallel operations, add it back and use
# tokio::task::spawn_blocking to keep async at edges only

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
