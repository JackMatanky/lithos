[package]
name = "traces-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "traces-cli"
path = "src/main.rs"
bench = false

[dependencies]

traces-app.workspace = true
traces-settings = { workspace = true, features = ["testing"] }
traces-fs.workspace = true

clap = { version = "4.6", features = ["env", "derive"] }
miette = { workspace = true, features = ["fancy"] }
thiserror.workspace = true
tracing.workspace = true
rkyv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
traces-indexer = { version = "0.1.0", path = "../indexer" }

# Note: tokio removed per Phase 5 - sync-first design
# If async is needed later for parallel operations, add it back and use
# tokio::task::spawn_blocking to keep async at edges only

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
traces-db.workspace = true

[lints]
workspace = true
